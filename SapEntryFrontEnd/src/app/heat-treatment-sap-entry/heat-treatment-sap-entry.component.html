<p-toast></p-toast>
<app-base-loader [loader]="isLoading"></app-base-loader>
<div class="container" [formGroup]="sapForm">
  <div class="input-row top-row">
    <div class="dropdown-row">
      <p-dropdown
        [options]="partNames"
        formControlName="coltPartName"
        placeholder="Select Part Name"
        class="custom-dropdown"
        [filter]="true"
        filterBy="label"
        (onChange)="onPartNameChange($event)">
      </p-dropdown>


    </div>

    <div class="float-label">
      <input type="text" id="coltPlant" formControlName="coltPlant" readonly />
      <label for="coltPlant">Plant Code</label>
    </div>
    <div class="float-label">
      <input type="number" id="colaQuantity" formControlName="colaQuantity" placeholder=" " />
      <label for="colaQuantity">Quantity</label>
    </div>
  </div>

  <div class="input-row">
    <div class="float-label">
      <!-- Show input field if there's only one machine value -->
      <input *ngIf="!showMachineDropdown" type="text" id="coltMachine" formControlName="coltMachine" placeholder="Production Version" readonly />

      <!-- Show dropdown if there are multiple machine values -->
      <p-dropdown *ngIf="showMachineDropdown"
                  [options]="machineValues"
                  [style]="{ width: '250px' }"
                  formControlName="coltMachine"
                  placeholder="Production Version">
      </p-dropdown>

    </div>

    <div class="float-label">
      <input type="text" id="coltBatch" formControlName="coltBatch" placeholder=" " />
      <label for="coltBatch">Batch</label>
    </div>
  </div>

  <div class="button-container">
    <button type="submit" (click)="onSubmit()">Submit</button>
  </div>
</div>
